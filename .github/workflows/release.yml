name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            artifact_name: marktyp-linux-amd64
            asset_name: marktyp-linux-amd64.tar.gz
            package_cmd: tar -czf marktyp-linux-amd64.tar.gz -C build/bin marktyp
          - name: windows-amd64
            os: windows-2022
            artifact_name: marktyp-windows-amd64
            asset_name: marktyp-windows-amd64.zip
            package_cmd: Compress-Archive -Path build/bin/marktyp.exe -DestinationPath marktyp-windows-amd64.zip
          - name: macos-amd64
            os: macos-13
            artifact_name: marktyp-macos-amd64
            asset_name: marktyp-macos-amd64.zip
            package_cmd: ditto -c -k --sequesterRsrc --keepParent build/bin/marktyp.app marktyp-macos-amd64.zip
          - name: macos-arm64
            os: macos-14
            artifact_name: marktyp-macos-arm64
            asset_name: marktyp-macos-arm64.zip
            package_cmd: ditto -c -k --sequesterRsrc --keepParent build/bin/marktyp.app marktyp-macos-arm64.zip

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build app on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "$(go env GOPATH)/bin/wails" build -clean

      - name: Build app on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$(go env GOPATH)/bin/wails.exe" build -clean

      - name: Package Linux release asset
        if: runner.os == 'Linux'
        shell: bash
        run: ${{ matrix.package_cmd }}

      - name: Package macOS release asset
        if: runner.os == 'macOS'
        shell: bash
        run: ${{ matrix.package_cmd }}

      - name: Package Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.package_cmd }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
          generate_release_notes: true
