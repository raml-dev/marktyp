[tools]
pipx = "1.8.0"
"python" = "3.13.10"

[env]
_.python.venv = { path = ".venv", create = true }
WAILS_ROOT = "{{config_root}}/../.."

[tasks.setup]
description = "Install icon generation dependencies"
run = "pip install -r requirements.txt"

[tasks.icons]
description = "Generate Wails icons from SVG"
run = "DYLD_FALLBACK_LIBRARY_PATH=/opt/homebrew/lib:${DYLD_FALLBACK_LIBRARY_PATH:-} python gen_icons.py marktyp-logo.svg --out ${WAILS_ROOT}/build"
depends = ["setup"]
